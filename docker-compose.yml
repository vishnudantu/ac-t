x-app-environment: &app-environment
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
  JWT_SECRET: ${JWT_SECRET:?Set a unique JWT_SECRET of at least 32 characters in .env}
  ALLOW_EPHEMERAL_DEV_AUTH: "false"
  LOG_LEVEL: ${LOG_LEVEL:-info}
  # Reserved SMTP settings: outbound delivery is not wired in the application yet.
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  postgres:
    image: postgres:16.13-alpine3.23
    container_name: aca-ticketops-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aca_ticketops}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_password_change_me}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Optional host access for local tooling; omit POSTGRES_HOST_PORT to keep the
    # database private to this Compose network in production-like deployments.
    ports:
      - "${POSTGRES_HOST_PORT:-127.0.0.1:55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks: [backend]
    logging: *default-logging

  migrate:
    build:
      context: .
      target: migrations
    profiles: [migration]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set the migration DATABASE_URL in .env}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        if [ ! -d /app/prisma/migrations ] || [ -z "$$(find /app/prisma/migrations -mindepth 2 -maxdepth 2 -name migration.sql -print -quit)" ]; then
          printf '%s\n' 'No reviewed Prisma migration history exists. Generate, review, and commit an initial migration before deploying.' >&2
          printf '%s\n' 'This service never runs prisma db push and has not modified the database.' >&2
          exit 1
        fi
        exec node node_modules/prisma/build/index.js migrate deploy --schema prisma/schema.prisma
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [backend]
    logging: *default-logging

  app:
    build:
      context: .
      target: runner
    environment: *app-environment
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks: [backend]
    logging: *default-logging

  # Unused integrations are opt-in plumbing, not proof of application support.
  redis:
    image: redis:7.4.8-alpine3.23
    profiles: [integrations]
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-local_demo_redis_password}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    restart: unless-stopped
    networks: [backend]
    logging: *default-logging

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    profiles: [integrations]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local_demo_minio_password}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [backend]
    logging: *default-logging

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  backend:
    driver: bridge
